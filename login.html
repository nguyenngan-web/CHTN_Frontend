<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Cửa Hàng Đồ Lễ Tuyết Nhàn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                container: {
                    center: true,
                    screens: {
                        sm: '600px',
                        md: '728px',
                        lg: '984px',
                        xl: '1240px',
                        '2xl': '1240px',
                    },
                },
                extend: { colors: { primary: '#6F2A2A', accent: '#c49a45', bgtheme: '#FFF3D9', } }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f3ee;
        }
    </style>
</head>

<body class=" flex flex-col min-h-screen">
    <!-- Header: Logo, Search, User/Cart -->
    <header class="bg-bgtheme">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
            <!-- Logo -->
            <a href="index.html" class="flex flex-col items-center group">
                <img src="img/logoTN.png" class="w-20 h-20 md:w-28 md:h-28 object-contain">
            </a>
            <!-- Search -->
            <div class="flex-1 max-w-xl mx-8">
                <div class="relative w-full">
                    <input type="text" id="search-input" placeholder="Tìm kiếm sản phẩm"
                        class="w-full border border-gray-200 rounded-lg py-2.5 px-5 pr-12 focus:outline-none focus:border-accent bg-white shadow-sm">
                    <button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary"
                        onclick="performGlobalSearch()">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m21 21l-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607" />
                        </svg>
                    </button>
                </div>
            </div>
            <!-- Account & Cart -->
            <div class="flex space-x-6 items-center py-4">
                <div id="auth-menu" class="flex items-center text-sm font-medium text-gray-700">
                    <a href="login.html" class="hover:text-accent mr-4">Đăng nhập</a>
                    <span class="text-gray-300 mr-4">|</span>
                    <a href="register.html" class="hover:text-accent">Đăng ký</a>
                </div>

                <a href="cart.html"
                    class="flex items-center text-sm font-medium text-gray-700 hover:text-accent transition group relative">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
                        </path>
                    </svg>
                    Giỏ hàng
                    <span id="cart-count"
                        class="absolute -top-2 -right-3 bg-primary text-white text-xs rounded-full px-1.5 py-0.5 shadow-sm">0</span>
                </a>
            </div>
        </div>
    </header>
    <!-- Navigation -->
    <nav class="bg-primary text-white shadow-md relative z-20">
        <div class="container mx-auto px-4">
            <ul
                class="flex flex-wrap justify-start md:justify-start space-x-6 md:space-x-8 text-xs md:text-sm uppercase tracking-wide font-medium py-3">
                <li class="relative group" id="category-dropdown-trigger">
                    <div class="flex items-center cursor-pointer hover:text-accent transition">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg> Danh mục
                    </div>
                    <!-- Dropdown -->
                    <div id="category-dropdown"
                        class="absolute left-0 mt-3 w-64 bg-white text-gray-800 shadow-xl border border-gray-100 rounded-sm opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 transform translate-y-2 group-hover:translate-y-0 z-50">
                        <ul id="category-list" class="py-2 max-h-[400px] overflow-y-auto">
                            <!-- JS Injected -->
                            <li class="px-6 py-3 text-sm text-gray-400 italic">Đang tải...</li>
                        </ul>
                    </div>
                </li>
                <li><a href="index.html" class="hover:text-accent transition block">Trang chủ</a></li>
                <li><a href="rituals.html" class="hover:text-accent transition block">Nghi lễ văn khấn</a></li>
                <li><a href="about.html" class="hover:text-accent transition block">Về chúng tôi</a></li>
                <li><a href="products.html" class="hover:text-accent transition block">Sản phẩm</a></li>
                <li><a href="contact.html" class="hover:text-accent transition block">Liên hệ</a></li>
            </ul>
        </div>
    </nav>
    <!-- Login -->
    <div class="container mx-auto px-4 py-2 text-[10px] md:text-xs text-gray-400 uppercase tracking-widest mt-2">
        Đăng nhập
    </div>
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-14 rounded-xl shadow-lg border border-primary">
            <div>
                <h2 class="mt-2 text-center text-3xl font-bold text-primary">Đăng Nhập</h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Hoặc <a href="register.html" class="font-medium text-accent">đăng ký tài khoản
                        mới</a>
                </p>
            </div>

            <div id="error-alert"
                class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
            </div>

            <form id="login-form" class="mt-8 space-y-6">
                <div class="rounded-md shadow-sm -space-y-px space-y-4">
                    <div>
                        <label for="phone" class="sr-only">Số điện thoại</label>
                        <input id="phone" name="phone" type="tel" required
                            class="appearance-none rounded relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"
                            placeholder="Số điện thoại">
                    </div>
                    <div>
                        <label for="password" class="sr-only">Mật khẩu</label>
                        <input id="password" name="password" type="password" required
                            class="appearance-none rounded relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"
                            placeholder="Mật khẩu">
                    </div>
                </div>

                <div>
                    <button type="submit" id="btn-submit"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-primary hover:bg-[#6b1414] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition">
                        Đăng Nhập
                    </button>
                </div>
            </form>

            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">Hoặc tiếp tục với</span>
                    </div>
                </div>

                <div class="mt-6">
                    <a href="https://chtnbackend-production.up.railway.app/api/auth/google/redirect"
                        class="w-full flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50">
                        <img class="h-5 w-5 mr-2" src="https://www.svgrepo.com/show/475656/google-color.svg"
                            alt="Google">
                        Google
                    </a>
                </div>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <footer class="bg-primary mt-auto">
        <div class="container mx-auto py-5">
            <div class="text-center text-xs text-gray-300 font-medium">
                &copy; 2026 Cửa hàng đồ lễ Tuyết Nhàn. Bảo lưu mọi quyền lợi.
            </div>
        </div>
    </footer>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireGuest();

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const error = urlParams.get('error');

            if (token) {
                ApiClient.setToken(token);
                window.location.href = 'index.html';
            }

            if (error) {
                const errAlert = document.getElementById('error-alert');
                if (error === 'locked') {
                    errAlert.innerText = 'Tài khoản của bạn đã bị khóa. Mời liên hệ chủ cửa hàng để biết thêm chi tiết.';
                } else {
                    errAlert.innerText = 'Đăng nhập Google thất bại.';
                }
                errAlert.classList.remove('hidden');

                // Remove error from URL to avoid showing it again on refresh
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            // Load Categories for Navigation
            try {
                const catRes = await ApiClient.get('/categories');
                const catList = document.getElementById('category-list');
                catList.innerHTML = '';
                catRes.data.forEach(cat => {
                    catList.innerHTML += `
                        <li>
                            <a href="products.html?category=${cat.slug}" class="flex items-center px-6 py-3 text-sm text-gray-700 hover:bg-bgtheme hover:text-primary transition group/item">
                                <span class="flex-grow">${cat.name}</span>
                                <svg class="w-4 h-4 text-gray-300 opacity-0 group-hover/item:opacity-100 group-hover/item:text-accent transition transform -translate-x-2 group-hover/item:translate-x-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </a>
                        </li>
                    `;
                });
            } catch (e) {
                console.error("Error loading categories:", e);
                if (document.getElementById('category-list')) {
                    document.getElementById('category-list').innerHTML = '<li class="px-6 py-3 text-sm text-red-500">Không thể tải danh mục.</li>';
                }
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const errAlert = document.getElementById('error-alert');

            btn.disabled = true;
            btn.innerText = 'Đang xử lý...';
            errAlert.classList.add('hidden');

            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'Thông tin đăng nhập không chính xác.');
                }

                ApiClient.setToken(data.token);

                const user = await Auth.getUser();
                if (user && user.role === 'admin') {
                    window.location.href = 'admin/dashboard.html';
                } else {
                    window.location.href = 'index.html';
                }
            } catch (err) {
                errAlert.innerText = err.message;
                errAlert.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = 'Đăng Nhập';
            }
        });
    </script>

</body>

</html>
