<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6F2A2A', accent: '#c49a45', bgtheme: '#F3EFE9', } } } }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f3ee;
        }
    </style>
</head>

<body class="bg-bgtheme flex h-screen overflow-hidden text-sm">
    <aside class="w-72 bg-primary text-gray-200 flex flex-col flex-shrink-0">
        <div class="p-8 pb-10">
            <h1 class="text-2xl font-bold leading-1 tracking-wider uppercase">
                Cửa hàng<br>Tuyết Nhàn
            </h1>
        </div>
        <nav class="flex-1">
            <a href="dashboard.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Trang quản trị</span>
            </a>
            <a href="orders.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="shopping-bag" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý đơn hàng</span>
            </a>
            <a href="products.html" class="flex items-center px-6 py-4 transition-colors bg-bgtheme text-primary">
                <i data-lucide="package" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý sản phẩm</span>
            </a>
            <a href="categories.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layers" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý danh mục</span>
            </a>
            <a href="rituals.html" class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="book-open" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý nghi lễ</span>
            </a>
            <a href="users.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="users" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý tài khoản</span>
            </a>
            <a href="analytics.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="bar-chart-3" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Thống kê</span>
            </a>
            <a href="system-config.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="settings" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Cài đặt</span>
            </a>
        </nav>
        <div class="p-6">
            <button onclick="Auth.logout()"
                class="flex items-center w-full px-6 py-4 transition-colors hover:text-gray-500 text-white">
                <i data-lucide="log-out" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Đăng xuất</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <div class="max-w-5xl mx-auto w-full">
            <div class="mb-4">
                <a href="products.html" class="text-gray-600 hover:text-primary">&larr; Quay lại danh sách</a>
            </div>

            <h1 id="page-title" class="text-2xl font-bold text-gray-800 mb-6">Thêm Sản Phẩm</h1>

            <div class="bg-white p-8 md:p-10 rounded-lg shadow w-full">
                <form id="product-form" class="space-y-6">
                    <input type="hidden" id="product-id">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-10">
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Tên sản phẩm *</label>
                            <input type="text" id="name" name="name" required
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1 text-gray-400"></label>
                            <input type="text" id="sku" name="sku" hidden
                                class="w-full border rounded px-3 py-2.5 bg-gray-50 text-gray-500 outline-none"
                                placeholder="Sẽ tự động tạo từ tên">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Danh mục *</label>
                            <select id="category_id" name="category_id" required
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary"></select>
                        </div>
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Giá bán *</label>
                            <input type="text" id="price" name="price" required placeholder="Ví dụ: 50.000"
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Tồn kho *</label>
                            <input type="number" id="stock" name="stock" required
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Trạng thái</label>
                            <select id="is_active" name="is_active"
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                                <option value="1">Đang bán</option>
                                <option value="0">Ngừng bán</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-gray-700">Mô tả chi tiết</label>
                        <textarea id="description" name="description" rows="5"
                            class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary" placeholder="Mô tả chi tiết về sản phẩm..."></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-10 border-t pt-6">
                        <div>
                            <label class="block font-bold text-primary mb-2">Dịp lễ liên quan (Holidays)</label>
                            <div id="holidays-container" class="grid grid-cols-2 gap-2 border rounded p-4 max-h-48 overflow-y-auto bg-gray-50 shadow-sm">
                                <!-- Injected dynamically via JS -->
                            </div>
                        </div>
                        <div>
                            <label class="block font-bold text-primary mb-2">Mục đích cúng bái (Purposes)</label>
                            <div id="purposes-container" class="grid grid-cols-2 gap-2 border rounded p-4 max-h-48 overflow-y-auto bg-gray-50 shadow-sm">
                                <!-- Injected dynamically via JS -->
                            </div>
                        </div>
                    </div>
                    <div class="border-t pt-6">
                        <h3 class="font-bold text-lg mb-4 text-primary">Hình ảnh sản phẩm</h3>
                        <div id="image-gallery" class="flex flex-wrap gap-4 mb-4"></div>

                        <div class="bg-gray-50 p-6 rounded-lg border border-dashed border-gray-300 shadow-sm">
                            <label class="block font-semibold mb-2 text-gray-700">Thêm ảnh mới (Có thể chọn nhiều ảnh)</label>
                            <input type="file" id="new-images" multiple accept="image/*"
                                class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-primary file:text-white hover:file:opacity-90 cursor-pointer">
                            <div id="new-images-preview" class="flex flex-wrap gap-4 mt-4"></div>
                        </div>
                    </div>
                    <div class="text-right border-t pt-6">
                        <button type="submit" id="btn-submit"
                            class="bg-primary text-white px-8 py-2.5 rounded shadow hover:opacity-90 font-bold uppercase tracking-wider text-xs">Lưu Sản Phẩm</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            Auth.requireLogin();
            const user = await Auth.getUser();
            if (!user || user.role !== 'admin') return window.location.href = '../index.html';

            const cats = await ApiClient.get('/admin/categories');
            cats.data.forEach(c => document.getElementById('category_id').innerHTML += `<option value="${c.id}">${c.name}</option>`);

            // Load holidays and purposes
            try {
                const [holidays, purposes] = await Promise.all([
                    ApiClient.get('/holidays'),
                    ApiClient.get('/purposes')
                ]);
                
                const holContainer = document.getElementById('holidays-container');
                const purContainer = document.getElementById('purposes-container');
                
                holContainer.innerHTML = '';
                purContainer.innerHTML = '';
                
                holidays.forEach(h => {
                    holContainer.innerHTML += `
                        <label class="flex items-center space-x-2 p-2 hover:bg-gray-100 rounded cursor-pointer">
                            <input type="checkbox" name="holiday_ids[]" value="${h.id}" class="rounded text-primary focus:ring-primary w-4 h-4">
                            <span class="text-xs text-gray-700 font-medium">${h.name}</span>
                        </label>
                    `;
                });
                
                purposes.forEach(p => {
                    purContainer.innerHTML += `
                        <label class="flex items-center space-x-2 p-2 hover:bg-gray-100 rounded cursor-pointer">
                            <input type="checkbox" name="purpose_ids[]" value="${p.id}" class="rounded text-primary focus:ring-primary w-4 h-4">
                            <span class="text-xs text-gray-700 font-medium">${p.name}</span>
                        </label>
                    `;
                });
            } catch (err) {
                console.error('Lỗi tải danh sách dịp lễ/mục đích:', err);
            }

            if (productId) {
                document.getElementById('page-title').innerText = 'Sửa Sản Phẩm';
                loadProduct(productId);
            }

            // Format price on blur, unformat on focus
            const priceInput = document.getElementById('price');
            priceInput.addEventListener('blur', function (e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value) {
                    e.target.value = Number(value).toLocaleString('vi-VN');
                }
            });
            priceInput.addEventListener('focus', function (e) {
                let value = e.target.value.replace(/\D/g, '');
                e.target.value = value;
            });

            // Preview for new images
            document.getElementById('new-images').addEventListener('change', function (e) {
                const preview = document.getElementById('new-images-preview');
                preview.innerHTML = '';
                Array.from(e.target.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        preview.innerHTML += `
                            <div class="w-20 h-20 border rounded relative">
                                <img src="${e.target.result}" class="w-full h-full object-cover rounded">
                            </div>
                        `;
                    };
                    reader.readAsDataURL(file);
                });
            });
        });

        async function loadProduct(id) {
            try {
                const res = await ApiClient.get(`/admin/products/${id}`);
                const p = res.data;
                document.getElementById('product-id').value = p.id;
                document.getElementById('name').value = p.name;
                document.getElementById('sku').value = p.sku || '';
                document.getElementById('category_id').value = p.category ? p.category.id : '';
                document.getElementById('price').value = Number(p.price).toLocaleString('vi-VN');
                document.getElementById('stock').value = p.stock;
                document.getElementById('is_active').value = p.is_active ? '1' : '0';
                document.getElementById('description').value = p.description || '';
                
                // Reset checkboxes first
                document.querySelectorAll('input[name="holiday_ids[]"]').forEach(cb => cb.checked = false);
                document.querySelectorAll('input[name="purpose_ids[]"]').forEach(cb => cb.checked = false);
                
                // Check currently associated holidays and purposes
                if (p.holidays) {
                    p.holidays.forEach(h => {
                        const cb = document.querySelector(`input[name="holiday_ids[]"][value="${h.id}"]`);
                        if (cb) cb.checked = true;
                    });
                }
                if (p.purposes) {
                    p.purposes.forEach(pur => {
                        const cb = document.querySelector(`input[name="purpose_ids[]"][value="${pur.id}"]`);
                        if (cb) cb.checked = true;
                    });
                }
                
                renderGallery(p.id, p.images);
            } catch (err) { showNotification('Lỗi tải sản phẩm', 'error'); }
        }

        function renderGallery(prodId, images) {
            const gallery = document.getElementById('image-gallery');
            gallery.innerHTML = '';
            if (!images) return;
            images.forEach(img => {
                gallery.innerHTML += `
                    <div class="relative w-32 h-32 border rounded shadow-sm group">
                        <img src="${img.image_url}" class="w-full h-full object-cover rounded">
                        <div class="absolute inset-0 bg-black bg-opacity-40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-2">
                            <button type="button" onclick="deleteImage(${prodId}, ${img.id})" class="bg-red-500 text-white p-1 rounded hover:bg-red-600" title="Xóa ảnh">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                            ${!img.is_primary ? `
                                <button type="button" onclick="setPrimary(${prodId}, ${img.id})" class="bg-blue-500 text-white p-1 rounded hover:bg-blue-600" title="Đặt làm ảnh chính">
                                    <i data-lucide="star" class="w-4 h-4"></i>
                                </button>
                            ` : ''}
                        </div>
                        ${img.is_primary ? '<span class="absolute top-0 left-0 bg-primary text-white text-[10px] px-2 py-0.5 rounded-br">Ảnh chính</span>' : ''}
                    </div>
                `;
            });
            lucide.createIcons();
        }

        async function setPrimary(prodId, imageId) {
            try {
                // We'll use a special endpoint or just update via PATCH
                await ApiClient.post(`/admin/products/${prodId}/images/${imageId}/set-primary`);
                loadProduct(prodId);
            } catch (e) { showNotification('Lỗi đặt ảnh chính', 'error'); }
        }

        async function deleteImage(prodId, imageId) {
            const isConfirmed = await showConfirm('Xác nhận xóa', 'Bạn có chắc chắn muốn xóa ảnh này?');
            if (!isConfirmed) return;
            try {
                await ApiClient.delete(`/admin/products/${prodId}/images/${imageId}`);
                loadProduct(prodId);
            } catch (e) { showNotification('Lỗi xóa ảnh', 'error'); }
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = 'Đang lưu...';
            const id = document.getElementById('product-id').value;
            
            const holidayIds = Array.from(document.querySelectorAll('input[name="holiday_ids[]"]:checked')).map(cb => parseInt(cb.value));
            const purposeIds = Array.from(document.querySelectorAll('input[name="purpose_ids[]"]:checked')).map(cb => parseInt(cb.value));
            
            const data = {
                name: document.getElementById('name').value,
                sku: document.getElementById('sku').value,
                category_id: document.getElementById('category_id').value,
                price: document.getElementById('price').value.replace(/\./g, ''),
                stock: document.getElementById('stock').value,
                is_active: document.getElementById('is_active').value,
                description: document.getElementById('description').value,
                holiday_ids: holidayIds,
                purpose_ids: purposeIds
            };
            try {
                let savedProduct;
                if (id) {
                    const res = await ApiClient.patch(`/admin/products/${id}`, data);
                    savedProduct = res.data;
                } else {
                    const res = await ApiClient.post('/admin/products', data);
                    savedProduct = res.data;
                }

                // Upload images separately — don't block save if this fails
                const fileInput = document.getElementById('new-images');
                if (fileInput.files.length > 0) {
                    try {
                        const formData = new FormData();
                        Array.from(fileInput.files).forEach(f => formData.append('files[]', f));
                        await ApiClient.post(`/admin/products/${savedProduct.id}/images`, formData, true);
                    } catch (imgErr) {
                        showNotification('Sản phẩm đã lưu thành công!\nTuy nhiên tải ảnh thất bại: ' + (imgErr.message || 'Lỗi Cloudinary chưa cấu hình.'), 'error');
                        setTimeout(() => window.location.href = 'products.html', 1500);
                        return;
                    }
                }

                showNotification('Lưu sản phẩm thành công!', 'success');
                setTimeout(() => window.location.href = 'products.html', 1000);
            } catch (err) {
                showNotification('Lỗi: ' + (err.message || 'Có lỗi xảy ra'), 'error');
                btn.disabled = false;
                btn.innerText = 'Lưu Sản Phẩm';
            }
        });
    </script>
</body>

</html>
