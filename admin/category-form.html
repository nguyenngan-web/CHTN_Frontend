<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6F2A2A', accent: '#c49a45', bgtheme: '#F3EFE9', } } } }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f3ee;
        }
    </style>
</head>

<body class="bg-bgtheme flex h-screen overflow-hidden text-sm">
    <aside class="w-72 bg-primary text-gray-200 flex flex-col flex-shrink-0">
        <div class="p-8 pb-10">
            <h1 class="text-2xl font-bold leading-1 tracking-wider uppercase">
                Cửa hàng<br>Tuyết Nhàn
            </h1>
        </div>
        <nav class="flex-1">
            <a href="dashboard.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Trang quản trị</span>
            </a>
            <a href="orders.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="shopping-bag" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý đơn hàng</span>
            </a>
            <a href="products.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="package" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý sản phẩm</span>
            </a>
            <a href="categories.html" class="flex items-center px-2 py-4 transition-colors bg-bgtheme text-primary">
                <i data-lucide="layers" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý danh mục</span>
            </a>
            <a href="rituals.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="book-open" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý nghi lễ</span>
            </a>
            <a href="users.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="users" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý tài khoản</span>
            </a>
            <a href="analytics.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="bar-chart-3" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Thống kê</span>
            </a>
            <a href="system-config.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="settings" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Cài đặt</span>
            </a>
        </nav>
        <div class="p-6">
            <button onclick="Auth.logout()"
                class="flex items-center w-full px-6 py-4 transition-colors hover:text-gray-500 text-white">
                <i data-lucide="log-out" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Đăng xuất</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <div class="max-w-5xl mx-auto w-full">
            <div class="mb-4">
                <a href="categories.html" class="text-gray-600 hover:text-primary">&larr; Quay lại danh sách</a>
            </div>

            <h1 id="page-title" class="text-2xl font-bold text-gray-800 mb-6">Thêm Danh Mục</h1>

            <div class="bg-white p-8 md:p-10 rounded-lg shadow w-full">
                <form id="category-form" class="space-y-6">
                    <input type="hidden" id="category-id">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Tên danh mục *</label>
                            <input type="text" id="name" name="name" required
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Hình ảnh danh mục</label>
                            <div class="flex items-center gap-4">
                                <div id="image-preview"
                                    class="w-24 h-24 border rounded bg-gray-50 flex items-center justify-center overflow-hidden shadow-sm">
                                    <i data-lucide="image" class="text-gray-300 w-10 h-10"></i>
                                </div>
                                <input type="file" id="image-file" accept="image/*" class="text-sm file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-primary file:text-white hover:file:opacity-90 cursor-pointer">
                            </div>
                        </div>
                    </div>
                    
                    <div class="space-y-6 pt-4 border-t">
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Mô tả</label>
                            <textarea id="description" name="description" rows="4"
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary" placeholder="Mô tả danh mục..."></textarea>
                        </div>
                        <div>
                            <label class="flex items-center space-x-2 cursor-pointer w-fit">
                                <input type="checkbox" id="is_active" checked class="rounded text-primary w-5 h-5">
                                <span class="text-sm font-medium text-gray-700">Kích hoạt danh mục</span>
                            </label>
                        </div>
                    </div>

                    <div class="text-right border-t pt-6">
                        <button type="submit" id="btn-submit"
                            class="bg-primary text-white px-8 py-2.5 rounded shadow hover:opacity-90 font-bold uppercase tracking-wider text-xs">Lưu Danh Mục</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const categoryId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            Auth.requireLogin();
            const user = await Auth.getUser();
            if (!user || user.role !== 'admin') return window.location.href = '../index.html';

            if (categoryId) {
                document.getElementById('page-title').innerText = 'Sửa Danh Mục';
                loadCategory(categoryId);
            }

            // Image preview
            document.getElementById('image-file').addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        document.getElementById('image-preview').innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                    };
                    reader.readAsDataURL(file);
                }
            });
        });

        async function loadCategory(id) {
            try {
                const res = await ApiClient.get(`/admin/categories/${id}`);
                const c = res.data;
                document.getElementById('category-id').value = c.id;
                document.getElementById('name').value = c.name;
                document.getElementById('description').value = c.description || '';
                document.getElementById('is_active').checked = !!c.is_active;

                if (c.image) {
                    document.getElementById('image-preview').innerHTML = `<img src="${c.image}" class="w-full h-full object-cover">`;
                }
            } catch (err) { showNotification('Lỗi tải danh mục', 'error'); }
        }

        document.getElementById('category-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = 'Đang lưu...';

            const id = document.getElementById('category-id').value;
            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('is_active', document.getElementById('is_active').checked ? 1 : 0);

            const fileInput = document.getElementById('image-file');
            if (fileInput.files[0]) {
                formData.append('image', fileInput.files[0]);
            }

            try {
                if (id) {
                    // Laravel PATCH with FormData often needs _method spoofing
                    formData.append('_method', 'PATCH');
                    await ApiClient.post(`/admin/categories/${id}`, formData, true);
                } else {
                    await ApiClient.post('/admin/categories', formData, true);
                }
                showNotification('Lưu danh mục thành công!', 'success');
                setTimeout(() => window.location.href = 'categories.html', 1000);
            } catch (err) {
                showNotification(err.message || 'Có lỗi xảy ra', 'error');
                btn.disabled = false;
                btn.innerText = 'Lưu Danh Mục';
            }
        });
    </script>
</body>

</html>
