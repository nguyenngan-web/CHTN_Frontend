<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu Hình Hệ Thống - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6F2A2A', accent: '#c49a45', bgtheme: '#F3EFE9', } } } }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f3ee;
        }
    </style>
</head>

<body class="bg-bgtheme flex h-screen overflow-hidden text-sm">
    <aside class="w-72 bg-primary text-gray-200 flex flex-col flex-shrink-0">
        <div class="p-8 pb-10">
            <h1 class="text-2xl font-bold leading-1 tracking-wider uppercase">
                Cửa hàng<br>Tuyết Nhàn
            </h1>
        </div>
        <nav class="flex-1">
            <a href="dashboard.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Trang quản trị</span>
            </a>
            <a href="orders.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="shopping-bag" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý đơn hàng</span>
            </a>
            <a href="products.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="package" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý sản phẩm</span>
            </a>
            <a href="categories.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layers" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý danh mục</span>
            </a>
            <a href="rituals.html" class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="book-open" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý nghi lễ</span>
            </a>
            <a href="users.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="users" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý tài khoản</span>
            </a>
            <a href="analytics.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="bar-chart-3" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Thống kê</span>
            </a>
            <a href="system-config.html" class="flex items-center px-2 py-4 transition-colors bg-bgtheme text-primary">
                <i data-lucide="settings" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Cài đặt</span>
            </a>
        </nav>
        <div class="p-6">
            <button onclick="Auth.logout()"
                class="flex items-center w-full px-6 py-4 transition-colors hover:text-gray-500 text-white">
                <i data-lucide="log-out" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Đăng xuất</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <div class="max-w-5xl mx-auto w-full">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Cấu Hình Hệ Thống</h1>

            <div class="bg-white p-8 md:p-10 rounded-lg shadow w-full">
                <div id="alert" class="hidden px-4 py-3 rounded mb-6 text-sm"></div>

                <form id="config-form" class="space-y-6">
                    <div class="border-b pb-6">
                        <h2 class="text-lg font-bold mb-4 text-primary">Thông tin chung</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <label class="block font-medium mb-1">Tên cửa hàng</label>
                                <input type="text" id="store_name" name="configs[store_name]"
                                    class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                            </div>
                            <div>
                                <label class="block font-medium mb-1">Số điện thoại hỗ trợ</label>
                                <input type="text" id="store_phone" name="configs[store_phone]"
                                    class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                            </div>
                        </div>
                    </div>

                    <div class="border-b pb-6">
                        <h2 class="text-lg font-bold mb-4 text-primary">Cấu hình thanh toán VietQR</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <label class="block font-medium mb-1">Mã ngân hàng (BIN/Tên viết tắt)</label>
                                <input type="text" id="bank_code" name="configs[bank_code]" placeholder="VD: VCB, MB, ICB"
                                    class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                            </div>
                            <div>
                                <label class="block font-medium mb-1">Số tài khoản</label>
                                <input type="text" id="bank_account_number" name="configs[bank_account_number]"
                                    class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block font-medium mb-1">Tên chủ tài khoản</label>
                                <input type="text" id="bank_account_name" name="configs[bank_account_name]"
                                    placeholder="Viết hoa không dấu"
                                    class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-lg font-bold mb-4 text-primary">Vận chuyển</h2>
                        <div>
                            <label class="block font-medium mb-1">Phí vận chuyển mặc định (VNĐ)</label>
                            <input type="number" id="shipping_fee_default" name="configs[shipping_fee_default]"
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                        </div>
                    </div>

                    <div class="text-right pt-6">
                        <button type="submit" id="btn-submit"
                            class="bg-primary text-white px-8 py-2.5 rounded shadow hover:opacity-90 font-bold uppercase tracking-wider text-xs">Lưu Cấu Hình</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            Auth.requireLogin();
            const user = await Auth.getUser();
            if (!user || user.role !== 'admin') return window.location.href = '../index.html';

            loadConfig();
        });

        async function loadConfig() {
            try {
                const res = await ApiClient.get('/admin/config');
                const conf = res;

                if (conf) {
                    document.getElementById('store_name').value = conf.store_name || '';
                    document.getElementById('store_phone').value = conf.store_phone || '';
                    document.getElementById('bank_code').value = conf.bank_code || '';
                    document.getElementById('bank_account_number').value = conf.bank_account_number || '';
                    document.getElementById('bank_account_name').value = conf.bank_account_name || '';
                    document.getElementById('shipping_fee_default').value = conf.shipping_fee_default || '0';
                }
            } catch (err) { console.error('Config fetch failed', err); }
        }

        document.getElementById('config-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const alertBox = document.getElementById('alert');

            btn.disabled = true;
            btn.innerText = 'Đang lưu...';
            alertBox.classList.add('hidden');

            const payload = {
                configs: {
                    store_name: document.getElementById('store_name').value,
                    store_phone: document.getElementById('store_phone').value,
                    bank_code: document.getElementById('bank_code').value,
                    bank_account_number: document.getElementById('bank_account_number').value,
                    bank_account_name: document.getElementById('bank_account_name').value,
                    shipping_fee_default: document.getElementById('shipping_fee_default').value
                }
            };

            try {
                await ApiClient.put('/admin/config', payload);
                alertBox.className = 'px-4 py-3 rounded mb-6 text-sm bg-green-100 text-green-700';
                alertBox.innerText = 'Đã lưu cấu hình thành công!';
            } catch (err) {
                alertBox.className = 'px-4 py-3 rounded mb-6 text-sm bg-red-100 text-red-700';
                alertBox.innerText = err.message || 'Lỗi lưu cấu hình';
            } finally {
                alertBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = 'Lưu Cấu Hình';
                setTimeout(() => alertBox.classList.add('hidden'), 3000);
            }
        });
    </script>
</body>

</html>
