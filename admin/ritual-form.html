<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Nghi Lễ - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6F2A2A', accent: '#c49a45', bgtheme: '#F3EFE9', } } } }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f3ee;
        }
    </style>
</head>

<body class="bg-bgtheme flex h-screen overflow-hidden text-sm">
    <aside class="w-72 bg-primary text-gray-200 flex flex-col flex-shrink-0">
        <div class="p-8 pb-10">
            <h1 class="text-2xl font-bold leading-1 tracking-wider uppercase">Cửa hàng<br>Tuyết Nhàn</h1>
        </div>
        <nav class="flex-1">
            <a href="dashboard.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Trang quản trị</span>
            </a>
            <a href="orders.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="shopping-bag" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý đơn hàng</span>
            </a>
            <a href="products.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="package" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý sản phẩm</span>
            </a>
            <a href="categories.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layers" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý danh mục</span>
            </a>
            <a href="rituals.html" class="flex items-center px-2 py-4 transition-colors bg-bgtheme text-primary">
                <i data-lucide="book-open" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý nghi lễ</span>
            </a>
            <a href="users.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="users" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý tài khoản</span>
            </a>
            <a href="analytics.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="bar-chart-3" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Thống kê</span>
            </a>
            <a href="system-config.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="settings" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Cài đặt</span>
            </a>
        </nav>
        <div class="p-6">
            <button onclick="Auth.logout()"
                class="flex items-center w-full px-6 py-4 transition-colors hover:text-gray-500 text-white">
                <i data-lucide="log-out" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Đăng xuất</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <div class="max-w-5xl mx-auto w-full">
            <a href="rituals.html"
                class="flex items-center gap-2 text-sm text-gray-500 hover:text-primary transition mb-6 w-fit">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Quay lại danh sách
            </a>

            <div class="mb-6 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800" id="page-title">Thêm Nghi Lễ</h1>
            </div>

            <div class="bg-white p-8 md:p-10 rounded-lg shadow w-full">
                <div id="error-alert" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm font-medium"></div>

                <form id="ritual-form" class="space-y-6">
                    <div class="grid grid-cols-1 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Tiêu đề bài viết *</label>
                            <input type="text" id="title" name="title" required
                                class="w-full border rounded px-3 py-2.5 focus:outline-none focus:border-primary">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Tóm tắt *</label>
                        <textarea id="summary" name="summary" required rows="2"
                            class="w-full border rounded px-3 py-2.5 focus:outline-none focus:border-primary"
                            placeholder="Tóm tắt ngắn gọn nội dung..."></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Ý nghĩa (Significance)</label>
                        <textarea id="significance" name="significance" rows="3"
                            class="w-full border rounded px-3 py-2.5 focus:outline-none focus:border-primary"
                            placeholder="Ý nghĩa tâm linh của nghi lễ này..."></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Lễ vật chuẩn bị (Preparation)</label>
                        <textarea id="preparation" name="preparation" rows="4"
                            class="w-full border rounded px-3 py-2.5 focus:outline-none focus:border-primary"
                            placeholder="Các lễ vật cần sắm sửa (có thể viết dạng danh sách hoặc văn bản)..."></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Nội dung văn khấn (Prayer
                            Text)</label>
                        <textarea id="prayer_text" name="prayer_text" rows="8"
                            class="w-full border rounded px-3 py-2.5 focus:outline-none focus:border-primary"
                            placeholder="Soạn thảo toàn văn bài cúng văn khấn..."></textarea>
                    </div>

                    <div class="flex justify-end gap-3 pt-6 border-t">
                        <button type="button" onclick="window.history.back()"
                            class="px-6 py-2.5 border rounded text-gray-600 hover:bg-gray-50 font-bold uppercase tracking-wider text-xs">Hủy</button>
                        <button type="submit" id="btn-submit"
                            class="bg-primary text-white px-8 py-2.5 rounded shadow hover:opacity-90 font-bold uppercase tracking-wider text-xs">Lưu
                            Lại</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            Auth.requireLogin();
            const user = await Auth.getUser();
            if (!user || user.role !== 'admin') return window.location.href = '../index.html';

            if (itemId) {
                document.getElementById('page-title').innerText = 'Chỉnh sửa Nghi Lễ';
                loadItem();
            }
        });

        async function loadItem() {
            try {
                const res = await ApiClient.get(`/admin/rituals/${itemId}`);
                const data = res.data || res;
                document.getElementById('title').value = data.title || '';
                document.getElementById('summary').value = data.summary || '';
                document.getElementById('significance').value = data.significance || '';
                document.getElementById('preparation').value = data.preparation || '';
                document.getElementById('prayer_text').value = data.prayer_text || '';
            } catch (err) {
                showNotification('Không thể tải thông tin. Vui lòng thử lại.', 'error');
                window.location.href = 'rituals.html';
            }
        }

        document.getElementById('ritual-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const alertEl = document.getElementById('error-alert');
            btn.disabled = true; btn.innerText = 'Đang lưu...';
            alertEl.classList.add('hidden');

            const formData = new FormData(e.target);

            try {
                if (itemId) {
                    formData.append('_method', 'PUT');
                    await ApiClient.post(`/admin/rituals/${itemId}`, formData, true);
                } else {
                    await ApiClient.post('/admin/rituals', formData, true);
                }
                window.location.href = 'rituals.html';
            } catch (err) {
                alertEl.innerText = err.message || 'Lỗi khi lưu.';
                alertEl.classList.remove('hidden');
                btn.disabled = false; btn.innerText = 'Lưu Lại';
            }
        });
    </script>
</body>

</html>
