<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6F2A2A', accent: '#c49a45', bgtheme: '#F3EFE9', } } } }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f3ee;
        }
    </style>
</head>

<body class="bg-bgtheme flex h-screen overflow-hidden text-sm">
    <aside class="w-72 bg-primary text-gray-200 flex flex-col flex-shrink-0">
        <div class="p-8 pb-10">
            <h1 class="text-2xl font-bold leading-1 tracking-[0.2em] uppercase ">
                Cửa hàng<br>Tuyết Nhàn
            </h1>
        </div>
        <nav class="flex-1  ">
            <a href="dashboard.html" class="flex items-center px-2 py-4 transition-colors bg-bgtheme text-primary">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Trang quản trị</span>
            </a>
            <a href="orders.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="shopping-bag" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý đơn hàng</span>
            </a>
            <a href="products.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="package" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý sản phẩm</span>
            </a>
            <a href="categories.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layers" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý danh mục</span>
            </a>
            <a href="rituals.html" class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="book-open" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý nghi lễ</span>
            </a>
            <a href="users.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="users" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý tài khoản</span>
            </a>
            <a href="analytics.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="bar-chart-3" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Thống kê</span>
            </a>
            <a href="system-config.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="settings" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Cài đặt</span>
            </a>
        </nav>
        <div class="p-6">
            <button onclick="Auth.logout()"
                class="flex items-center w-full px-6 py-4 transition-colors hover:text-gray-500 text-white">
                <i data-lucide="log-out" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Đăng xuất</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-12">
        <h1 class="text-4xl font-bold mb-12 text-primary">Tổng quan cửa hàng</h1>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 pb-10">
            <div class="bg-white p-6 rounded-lg h-fit">
                <i data-lucide="banknote" class="w-8 h-8 text-accent"></i>
                <h3 class="text-gray-600 font-semibold tracking-[0.2em] uppercase">Doanh thu</h3>
                <p id="total-revenue" class="text-2xl font-bold text-gray-900">0đ</p>
            </div>
            <!-- Đơn Hàng -->
            <div class="bg-white p-6 rounded-lg h-fit">
                <i data-lucide="receipt" class="w-8 h-8 text-accent"></i>
                <h3 class="text-gray-600 font-semibold tracking-[0.2em] uppercase">Đơn hàng</h3>
                <p id="total-orders" class="text-2xl font-bold text-gray-900">0</p>
            </div>
            <!-- Chờ Xử Lý -->
            <div class="bg-white p-6 rounded-lg h-fit">
                <i data-lucide="bell" class="w-8 h-8 text-accent"></i>
                <h3 class="text-gray-600 font-semibold tracking-[0.2em] uppercase">Chờ xử lý</h3>
                <p id="pending-orders" class="text-2xl font-bold text-gray-900">0</p>
            </div>
            <!-- Khách Hàng -->
            <div class="bg-white p-6 rounded-lg h-fit">
                <i data-lucide="user-plus" class="w-8 h-8 text-accent"></i>
                <h3 class="text-gray-600 font-semibold tracking-[0.2em] uppercase">Khách hàng</h3>
                <p id="total-customers" class="text-2xl font-bold text-gray-900">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg">Hiệu suất cửa hàng</h3>
                    <select id="revenue-period" class="border rounded px-2 py-1 text-sm outline-none">
                        <option value="7d">7 ngày qua</option>
                        <option value="30d">30 ngày qua</option>
                        <option value="12m">12 tháng qua</option>
                    </select>
                </div>
                <canvas id="revenueChart" height="120"></canvas>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <h3 class="font-bold text-lg mb-4">Đơn hàng gần đây</h3>
                <div id="recent-orders" class="space-y-4"></div>
                <div class=" text-center italic">
                    <a href="orders.html" class="text-gray-800 hover:text-primary "> Xem thêm
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let chartInstance = null;

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            Auth.requireLogin();
            const user = await Auth.getUser();
            if (!user || user.role !== 'admin') return window.location.href = '../index.html';

            loadDashboardStats();
            loadRevenueChart('7d');

            document.getElementById('revenue-period').addEventListener('change', (e) => {
                loadRevenueChart(e.target.value);
            });
        });

        async function loadDashboardStats() {
            try {
                const res = await ApiClient.get('/admin/dashboard/stats');
                document.getElementById('total-revenue').innerText = Number(res.total_revenue).toLocaleString('vi-VN') + 'đ';
                document.getElementById('total-orders').innerText = res.total_orders;
                document.getElementById('pending-orders').innerText = res.pending_orders;
                document.getElementById('total-customers').innerText = res.total_customers;

                const ordRes = await ApiClient.get('/admin/orders?page=1');
                const recent = ordRes.data.slice(0, 4);
                const list = document.getElementById('recent-orders');
                list.innerHTML = recent.map(o => `
                    <div class="flex justify-between items-center border-b border-gray-100 pb-3 text-sm">
                        <div>
                            <a href="order-detail.html?id=${o.id}" class="font-bold text-blue-600 hover:underline">${o.order_code}</a>
                            <p class="text-gray-500">${o.fullname}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold">${Number(o.total_amount).toLocaleString('vi-VN')} đ</p>
                            <span class="text-[10px] px-2 py-0.5 rounded-full 
                                ${o.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
                        o.status === 'confirmed' ? 'bg-blue-100 text-blue-800' :
                            o.status === 'shipping' ? 'bg-purple-100 text-purple-800' :
                                o.status === 'delivered' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                ${o.status === 'pending' ? 'Chờ xử lý' :
                        o.status === 'confirmed' ? 'Xác nhận' :
                            o.status === 'shipping' ? 'Đang giao' :
                                o.status === 'delivered' ? 'Hoàn thành' : 'Hủy đơn'}
                            </span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function loadRevenueChart(period) {
            try {
                const res = await ApiClient.get(`/admin/dashboard/revenue?period=${period}`);
                const data = res.data;

                const labels = data.map(d => d.date);
                const values = data.map(d => d.revenue);

                const ctx = document.getElementById('revenueChart').getContext('2d');
                if (chartInstance) chartInstance.destroy();

                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Doanh thu (VND)',
                            data: values,
                            borderColor: '#6F2A2A',
                            backgroundColor: 'rgba(111, 42, 42, 0.05)',
                            tension: 0.3,
                            fill: true,
                            pointBackgroundColor: '#6F2A2A'
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>

</html>
