<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Nghi Lễ - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6F2A2A', accent: '#c49a45', bgtheme: '#F3EFE9', } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f3ee; }
    </style>
</head>
<body class="bg-bgtheme flex h-screen overflow-hidden text-sm">
    <aside class="w-72 bg-primary text-gray-200 flex flex-col flex-shrink-0">
        <div class="p-8 pb-10">
            <h1 class="text-2xl font-bold leading-1 tracking-wider uppercase">Cửa hàng<br>Tuyết Nhàn</h1>
        </div>
        <nav class="flex-1">
            <a href="dashboard.html" class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Trang quản trị</span>
            </a>
            <a href="orders.html" class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="shopping-bag" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý đơn hàng</span>
            </a>
            <a href="products.html" class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="package" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý sản phẩm</span>
            </a>
            <a href="categories.html" class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layers" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý danh mục</span>
            </a>
            <a href="rituals.html" class="flex items-center px-2 py-4 transition-colors bg-bgtheme text-primary">
                <i data-lucide="book-open" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý nghi lễ</span>
            </a>
            <a href="users.html" class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="users" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý tài khoản</span>
            </a>
            <a href="analytics.html" class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="bar-chart-3" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Thống kê</span>
            </a>
            <a href="system-config.html" class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="settings" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Cài đặt</span>
            </a>
        </nav>
        <div class="p-6">
            <button onclick="Auth.logout()" class="flex items-center w-full px-6 py-4 transition-colors hover:text-gray-500 text-white">
                <i data-lucide="log-out" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Đăng xuất</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h1 class="text-2xl font-bold text-gray-800">Quản Lý Nghi Lễ</h1>
            <div class="flex items-center gap-4">

                <a href="ritual-form.html" class="bg-primary text-white px-4 py-2 rounded shadow hover:opacity-90 flex items-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> Thêm Nghi Lễ
                </a>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-100 border-b text-xs uppercase text-gray-500 tracking-wider">
                    <tr>
                        <th class="p-4">Tiêu đề</th>
                        <th class="p-4">Tóm tắt</th>
                        <th class="p-4 text-center">Lượt xem</th>
                        <th class="p-4 text-right">Hành động</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y text-gray-700"></tbody>
            </table>
            <div id="pagination" class="p-4 flex justify-center space-x-2 border-t"></div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let currentPage = 1;
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            Auth.requireLogin();
            const user = await Auth.getUser();
            if (!user || user.role !== 'admin') return window.location.href = '../index.html';
            loadItems();
        });

        async function loadItems(page = 1) {
            currentPage = page;
            try {
                const res = await ApiClient.get(`/admin/rituals?page=${page}`);
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = res.data.map(item => `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4 font-bold text-gray-900">${item.title}</td>
                        <td class="p-4 text-gray-600 max-w-xs truncate" title="${item.summary || ''}">${item.summary || '—'}</td>
                        <td class="p-4 text-center">${item.views}</td>
                        <td class="p-4 space-x-3 text-right">
                            <a href="ritual-form.html?id=${item.id}" class="text-blue-600 hover:text-blue-800 font-medium">Sửa</a>
                            <button onclick="deleteItem(${item.id})" class="text-red-600 hover:text-red-800 font-medium">Xóa</button>
                        </td>
                    </tr>
                `).join('');

                renderPagination(res.meta);
            } catch (err) { console.error(err); }
        }

        function renderPagination(meta) {
            const el = document.getElementById('pagination');
            el.innerHTML = '';
            if (!meta || meta.last_page <= 1) return;
            for (let i = 1; i <= meta.last_page; i++) {
                el.innerHTML += `<button onclick="loadItems(${i})" class="px-3 py-1 border rounded ${i === currentPage ? 'bg-primary text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}">${i}</button>`;
            }
        }

        async function deleteItem(id) {
            const isConfirmed = await showConfirm('Xác nhận xóa', 'Xác nhận xóa bài nghi lễ này? Thao tác không thể hoàn tác.');
            if (!isConfirmed) return;
            try {
                await ApiClient.delete(`/admin/rituals/${id}`);
                loadItems(currentPage);
            } catch (err) { showNotification(err.message || 'Lỗi', 'error'); }
        }
    </script>
</body>
</html>
