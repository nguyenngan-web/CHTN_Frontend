<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Người Dùng - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6F2A2A', accent: '#c49a45', bgtheme: '#F3EFE9', } } } }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f3ee;
        }
    </style>
</head>

<body class="bg-bgtheme flex h-screen overflow-hidden text-sm">
    <aside class="w-72 bg-primary text-gray-200 flex flex-col flex-shrink-0">
        <div class="p-8 pb-10">
            <h1 class="text-2xl font-bold leading-1 tracking-wider uppercase">
                Cửa hàng<br>Tuyết Nhàn
            </h1>
        </div>
        <nav class="flex-1">
            <a href="dashboard.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Trang quản trị</span>
            </a>
            <a href="orders.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="shopping-bag" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý đơn hàng</span>
            </a>
            <a href="products.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="package" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý sản phẩm</span>
            </a>
            <a href="categories.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layers" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý danh mục</span>
            </a>
            <a href="rituals.html" class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="book-open" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý nghi lễ</span>
            </a>
            <a href="users.html" class="flex items-center px-2 py-4 transition-colors bg-bgtheme text-primary">
                <i data-lucide="users" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý tài khoản</span>
            </a>
            <a href="analytics.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="bar-chart-3" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Thống kê</span>
            </a>
            <a href="system-config.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="settings" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Cài đặt</span>
            </a>
        </nav>
        <div class="p-6">
            <button onclick="Auth.logout()"
                class="flex items-center w-full px-6 py-4 transition-colors hover:text-gray-500 text-white">
                <i data-lucide="log-out" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Đăng xuất</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Người Dùng</h1>

        <div class="bg-white p-4 rounded-t-lg shadow border-b flex gap-4">
            <input type="text" id="search" placeholder="Tên, Email, Điện thoại..."
                class="border rounded px-3 py-2 flex-1 outline-none focus:border-primary">
            <select id="role" class="border rounded px-3 py-2 w-40 outline-none focus:border-primary">
                <option value="">Tất cả quyền</option>
                <option value="customer">Khách hàng</option>
                <option value="admin">Admin</option>
            </select>
            <button onclick="loadItems(1)" class="bg-gray-800 text-white px-6 py-2 rounded hover:bg-gray-700 shadow">Tìm
                kiếm</button>
        </div>

        <div class="bg-white rounded-b-lg shadow overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-100 border-b text-gray-700">
                    <tr>
                        <th class="p-4">Người dùng</th>
                        <th class="p-4">Quyền</th>
                        <th class="p-4 text-center">Đơn hàng</th>
                        <th class="p-4 text-center">Trạng thái</th>
                        <th class="p-4">Ngày tham gia</th>
                        <th class="p-4 text-right">Hành động</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y text-gray-800"></tbody>
            </table>
            <div id="pagination" class="p-4 flex justify-center space-x-2 border-t"></div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let currentPage = 1;
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            Auth.requireLogin();
            const user = await Auth.getUser();
            if (!user || user.role !== 'admin') return window.location.href = '../index.html';
            loadItems();
        });

        async function loadItems(page = 1) {
            currentPage = page;
            const params = new URLSearchParams({ page });
            if (document.getElementById('search').value) params.append('search', document.getElementById('search').value);
            if (document.getElementById('role').value) params.append('role', document.getElementById('role').value);

            try {
                const res = await ApiClient.get(`/admin/users?${params.toString()}`);
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = res.data.map(u => `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4 flex items-center gap-3">
                            <img src="${u.avatar || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full object-cover border">
                            <div>
                                <div class="font-bold">${u.fullname}</div>
                                <div class="text-xs text-gray-500">${u.email}</div>
                                <div class="text-xs text-gray-500">${u.phone || ''}</div>
                            </div>
                        </td>
                        <td class="p-4">
                            <select onchange="updateRole(${u.id}, this.value)" class="border rounded px-2 py-1 text-sm outline-none bg-white">
                                <option value="customer" ${u.role === 'customer' ? 'selected' : ''}>Khách hàng</option>
                                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                        </td>
                        <td class="p-4 text-center font-bold text-primary">${u.orders_count || 0}</td>
                        <td class="p-4 text-center">
                            <span class="px-2 py-1 rounded text-xs font-medium ${u.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                ${u.status === 'active' ? 'Hoạt động' : 'Đã khóa'}
                            </span>
                        </td>
                        <td class="p-4 text-sm text-gray-500">${new Date(u.created_at).toLocaleDateString('vi-VN')}</td>
                        <td class="p-4 text-right">
                            <button onclick="toggleLock(${u.id}, '${u.status}')" class="${u.status === 'active' ? 'text-red-600' : 'text-green-600'} hover:underline font-medium">
                                ${u.status === 'active' ? 'Khóa' : 'Mở khóa'}
                            </button>
                        </td>
                    </tr>
                `).join('');
                renderPagination(res.meta);
            } catch (err) { console.error(err); }
        }

        function renderPagination(meta) {
            const el = document.getElementById('pagination');
            el.innerHTML = '';
            if (!meta || meta.last_page <= 1) return;
            for (let i = 1; i <= meta.last_page; i++) {
                el.innerHTML += `<button onclick="loadItems(${i})" class="px-3 py-1 border rounded ${i === currentPage ? 'bg-primary text-white' : 'bg-white hover:bg-gray-100'}">${i}</button>`;
            }
        }

        async function updateRole(id, role) {
            const isConfirmed = await showConfirm('Thay đổi quyền', 'Thay đổi quyền của người dùng này?');
            if (!isConfirmed) {
                loadItems(currentPage); // revert selection visually
                return;
            }
            try {
                await ApiClient.patch(`/admin/users/${id}/role`, { role });
                loadItems(currentPage);
            } catch (err) { showNotification(err.message, 'error'); }
        }
 
        async function toggleLock(id, currentStatus) {
            const action = currentStatus === 'active' ? 'khóa' : 'mở khóa';
            const isConfirmed = await showConfirm('Xác nhận thao tác', `Xác nhận ${action} người dùng này?`);
            if (!isConfirmed) return;
            try {
                await ApiClient.patch(`/admin/users/${id}/toggle-lock`);
                loadItems(currentPage);
            } catch (err) { showNotification(err.message, 'error'); }
        }
    </script>
</body>

</html>
