<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6F2A2A', accent: '#c49a45', bgtheme: '#F3EFE9', } } } }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f3ee;
        }
    </style>
</head>

<body class="bg-bgtheme flex h-screen overflow-hidden text-sm">
    <aside class="w-72 bg-primary text-gray-200 flex flex-col flex-shrink-0">
        <div class="p-8 pb-10">
            <h1 class="text-2xl font-bold leading-1 tracking-wider uppercase">
                Cửa hàng<br>Tuyết Nhàn
            </h1>
        </div>
        <nav class="flex-1">
            <a href="dashboard.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Trang quản trị</span>
            </a>
            <a href="orders.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="shopping-bag" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý đơn hàng</span>
            </a>
            <a href="products.html" class="flex items-center px-2 py-4 transition-colors bg-bgtheme text-primary">
                <i data-lucide="package" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý sản phẩm</span>
            </a>
            <a href="categories.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layers" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý danh mục</span>
            </a>
            <a href="rituals.html" class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="book-open" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý nghi lễ</span>
            </a>
            <a href="users.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="users" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý tài khoản</span>
            </a>
            <a href="analytics.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="bar-chart-3" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Thống kê</span>
            </a>
            <a href="system-config.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="settings" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Cài đặt</span>
            </a>
        </nav>
        <div class="p-6">
            <button onclick="Auth.logout()"
                class="flex items-center w-full px-6 py-4 transition-colors hover:text-gray-500 text-white">
                <i data-lucide="log-out" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Đăng xuất</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Sản Phẩm</h1>
            <a href="product-form.html" class="bg-primary text-white px-4 py-2 rounded shadow hover:opacity-90">Thêm Sản
                Phẩm</a>
        </div>

        <div class="bg-white p-4 rounded-t-lg shadow border-b flex flex-wrap gap-4">
            <input type="text" id="search" placeholder="Tìm kiếm tên sản phẩm"
                class="border rounded px-3 py-2 flex-1 min-w-[200px] outline-none focus:border-primary">
            <select id="category_id" class="border rounded px-3 py-2 w-48 outline-none focus:border-primary">
                <option value="">Tất cả danh mục</option>
            </select>
            <select id="is_active" class="border rounded px-3 py-2 w-40 outline-none focus:border-primary">
                <option value="">Trạng thái</option>
                <option value="1">Đang bán</option>
                <option value="0">Ngừng bán</option>
            </select>
            <select id="stock_status" class="border rounded px-3 py-2 w-40 outline-none focus:border-primary">
                <option value="">Tình trạng kho</option>
                <option value="low">Sắp hết hàng</option>
                <option value="out">Hết hàng</option>
            </select>
            <button onclick="loadItems(1)"
                class="bg-gray-800 text-white px-6 py-2 rounded hover:bg-gray-700 shadow">Lọc</button>
        </div>

        <div class="bg-white rounded-b-lg shadow overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-100 border-b">
                    <tr>
                        <th class="p-4 w-16">Ảnh</th>
                        <th class="p-4">Tên</th>
                        <th class="p-4">Danh mục</th>
                        <th class="p-4 text-right">Giá</th>
                        <th class="p-4 text-center">Tồn kho</th>
                        <th class="p-4 text-center">Trạng thái</th>
                        <th class="p-4 text-right">Hành động</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y text-gray-700"></tbody>
            </table>
            <div id="pagination" class="p-4 flex justify-center space-x-2 border-t"></div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let currentPage = 1;
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            Auth.requireLogin();
            const user = await Auth.getUser();
            if (!user || user.role !== 'admin') return window.location.href = '../index.html';

            ApiClient.get('/admin/categories').then(res => {
                const sel = document.getElementById('category_id');
                res.data.forEach(c => sel.innerHTML += `<option value="${c.id}">${c.name}</option>`);
            });

            loadItems();
        });

        async function loadItems(page = 1) {
            currentPage = page;
            const params = new URLSearchParams({ page });
            if (document.getElementById('search').value) params.append('search', document.getElementById('search').value);
            if (document.getElementById('category_id').value) params.append('category_id', document.getElementById('category_id').value);
            if (document.getElementById('is_active').value !== '') params.append('is_active', document.getElementById('is_active').value);
            if (document.getElementById('stock_status').value) params.append('stock_status', document.getElementById('stock_status').value);

            try {
                const res = await ApiClient.get(`/admin/products?${params.toString()}`);
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = res.data.map(item => `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4"><img src="${item.primary_image || 'https://via.placeholder.com/40'}" class="w-12 h-12 object-cover rounded border"></td>
                        <td class="p-4">
                            <div class="font-bold text-gray-900">${item.name}</div>
                            <div class="text-xs text-gray-500 mt-1">${item.sku || 'N/A'}</div>
                        </td>
                        <td class="p-4">${item.category ? item.category.name : ''}</td>
                        <td class="p-4 text-right text-primary font-bold">${Number(item.sale_price || item.price).toLocaleString('vi-VN')} đ</td>
                        <td class="p-4 text-center font-medium ${item.stock < 10 ? 'text-red-500' : ''}">${item.stock}</td>
                        <td class="p-4 text-center">
                            <span class="px-2 py-1 rounded text-xs ${item.is_active ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                ${item.is_active ? 'Đang bán' : 'Ngừng bán'}
                            </span>
                        </td>
                        <td class="p-4 space-x-3 text-right">
                            <a href="product-form.html?id=${item.id}" class="text-blue-600 hover:underline font-medium">Sửa</a>
                            <button onclick="deleteItem(${item.id})" class="text-red-600 hover:underline font-medium">Xóa</button>
                        </td>
                    </tr>
                `).join('');
                renderPagination(res.meta);
            } catch (err) { console.error(err); }
        }

        function renderPagination(meta) {
            const el = document.getElementById('pagination');
            el.innerHTML = '';
            if (!meta || meta.last_page <= 1) return;
            for (let i = 1; i <= meta.last_page; i++) {
                el.innerHTML += `<button onclick="loadItems(${i})" class="px-3 py-1 border rounded ${i === currentPage ? 'bg-primary text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}">${i}</button>`;
            }
        }

        async function deleteItem(id) {
            const isConfirmed = await showConfirm('Xác nhận xóa', 'Bạn có chắc chắn muốn xóa sản phẩm này?');
            if (!isConfirmed) return;
            try {
                const res = await ApiClient.delete(`/admin/products/${id}`);
                if (res && res.message) {
                    showNotification(res.message, 'success');
                } else {
                    showNotification('Đã xóa sản phẩm thành công!', 'success');
                }
                loadItems(currentPage);
            } catch (err) { showNotification(err.message, 'error'); }
        }
    </script>
</body>

</html>
