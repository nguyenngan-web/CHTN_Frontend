<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống Kê Phân Tích - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6F2A2A', accent: '#c49a45', bgtheme: '#F3EFE9', } } } }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f3ee;
        }
    </style>
</head>

<body class="bg-bgtheme flex h-screen overflow-hidden text-sm">
    <aside class="w-72 bg-primary text-gray-200 flex flex-col flex-shrink-0">
        <div class="p-8 pb-10">
            <h1 class="text-2xl font-bold leading-1 tracking-wider uppercase">
                Cửa hàng<br>Tuyết Nhàn
            </h1>
        </div>
        <nav class="flex-1">
            <a href="dashboard.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Trang quản trị</span>
            </a>
            <a href="orders.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="shopping-bag" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý đơn hàng</span>
            </a>
            <a href="products.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="package" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý sản phẩm</span>
            </a>
            <a href="categories.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layers" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý danh mục</span>
            </a>
            <a href="rituals.html" class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="book-open" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý nghi lễ</span>
            </a>
            <a href="users.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="users" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý tài khoản</span>
            </a>
            <a href="analytics.html" class="flex items-center px-2 py-4 transition-colors bg-bgtheme text-primary">
                <i data-lucide="bar-chart-3" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Thống kê</span>
            </a>
            <a href="system-config.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="settings" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Cài đặt</span>
            </a>
        </nav>
        <div class="p-6">
            <button onclick="Auth.logout()"
                class="flex items-center w-full px-6 py-4 transition-colors hover:text-gray-500 text-white">
                <i data-lucide="log-out" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Đăng xuất</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Thống Kê Nâng Cao</h1>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <div class="bg-white p-6 rounded-lg shadow">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg">Doanh Thu Gần Đây</h3>
                    <select id="rev-period" class="border rounded px-2 py-1 outline-none text-sm">
                        <option value="7d">7 ngày qua</option>
                        <option value="30d">30 ngày qua</option>
                        <option value="12m">12 tháng qua</option>
                    </select>
                </div>
                <canvas id="revChart"></canvas>
            </div>

            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-bold text-lg mb-4">Tỷ Lệ Trạng Thái Đơn Hàng</h3>
                <div class="w-2/3 mx-auto">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-bold text-lg mb-4">Top 5 Sản Phẩm Bán Chạy Nhất</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 border-b text-gray-600">
                            <tr>
                                <th class="p-2">Sản phẩm</th>
                                <th class="p-2 text-center">Đã bán</th>
                                <th class="p-2 text-right">Giá trị</th>
                            </tr>
                        </thead>
                        <tbody id="top-products" class="divide-y"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg">Tăng Trưởng Người Dùng</h3>
                    <select id="users-period" class="border rounded px-2 py-1 outline-none text-sm">
                        <option value="7d">7 ngày qua</option>
                        <option value="30d">30 ngày qua</option>
                        <option value="12m">12 tháng qua</option>
                    </select>
                </div>
                <canvas id="usersChart"></canvas>
            </div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let revChartIns = null;
        let statusChartIns = null;
        let usersChartIns = null;

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            Auth.requireLogin();
            const user = await Auth.getUser();
            if (!user || user.role !== 'admin') return window.location.href = '../index.html';

            loadRevenueChart('7d');
            loadTopProducts();
            loadStatusBreakdown();
            loadUsersGrowthChart('7d');

            document.getElementById('rev-period').addEventListener('change', (e) => loadRevenueChart(e.target.value));
            document.getElementById('users-period').addEventListener('change', (e) => loadUsersGrowthChart(e.target.value));
        });

        async function loadRevenueChart(period) {
            try {
                const res = await ApiClient.get(`/admin/dashboard/revenue?period=${period}`);
                const labels = res.data.map(d => d.date);
                const values = res.data.map(d => d.revenue);

                const ctx = document.getElementById('revChart').getContext('2d');
                if (revChartIns) revChartIns.destroy();

                revChartIns = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Doanh thu (VND)',
                            data: values,
                            backgroundColor: 'rgba(111, 42, 42, 0.8)',
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });
            } catch (err) { console.error(err); }
        }

        async function loadTopProducts() {
            try {
                const res = await ApiClient.get('/admin/dashboard/stats');
                const top5 = res.top_products || [];
                document.getElementById('top-products').innerHTML = top5.map((p, index) => `
                    <tr>
                        <td class="p-2 flex items-center gap-2">
                            <span class="font-bold text-gray-400 w-4">${index + 1}</span>
                            <img src="${p.primary_image || 'https://via.placeholder.com/30'}" class="w-8 h-8 rounded border">
                            <span class="font-medium truncate max-w-[200px]">${p.product_name}</span>
                        </td>
                        <td class="p-2 text-center font-bold text-primary">${p.total_sold}</td>
                        <td class="p-2 text-right">${Number(p.sale_price || p.price).toLocaleString('vi-VN')} đ</td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function loadStatusBreakdown() {
            try {
                const res = await ApiClient.get('/admin/dashboard/stats');
                const counts = res.order_status_breakdown || {};
                
                const p = counts['pending'] || 0;
                const c = counts['confirmed'] || 0;
                const s = counts['shipping'] || 0;
                const d = counts['delivered'] || 0;
                const ca = counts['cancelled'] || 0;

                const ctx = document.getElementById('statusChart').getContext('2d');
                statusChartIns = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Chờ xử lý', 'Xác nhận', 'Đang giao', 'Hoàn thành', 'Đã hủy'],
                        datasets: [{
                            data: [p, c, s, d, ca],
                            backgroundColor: ['#FCD34D', '#60A5FA', '#C084FC', '#34D399', '#F87171'],
                            borderWidth: 0
                        }]
                    },
                    options: { responsive: true, cutout: '70%' }
                });
            } catch (err) { }
        }

        async function loadUsersGrowthChart(period) {
            try {
                const res = await ApiClient.get(`/admin/dashboard/users-growth?period=${period}`);
                const labels = res.data.map(d => d.date);
                const values = res.data.map(d => d.count);

                const ctx = document.getElementById('usersChart').getContext('2d');
                if (usersChartIns) usersChartIns.destroy();

                usersChartIns = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Người dùng mới',
                            data: values,
                            borderColor: '#c49a45',
                            backgroundColor: 'rgba(196, 154, 69, 0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                    }
                });
            } catch (err) { console.error(err); }
        }
    </script>
</body>

</html>
